<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon" aria-hidden="true">▥</div><div><b>两天冲刺</b><span>OS / 13180</span></div></div><div class="nav-label">学习工作台</div><nav class="nav" id="nav" aria-label="学习导航"></nav><div class="side-footer"><div class="side-note"><span class="side-dot"></span>先理解，再练习，再回忆。<p class="tiny" style="margin-top:10px">湖北自考本科 · 操作系统<br>2023 年版教材 · 八章覆盖</p></div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">学习工作台 <span style="margin:0 9px">/</span> <strong id="crumb">今日冲刺</strong></div><div class="timer"><span class="tiny muted">专注</span><span class="timer-time mono" id="focus-clock">25:00</span><button data-action="timer-toggle" id="timer-toggle">开始</button><button data-action="timer-reset" aria-label="重置专注计时">↻</button></div></header><main class="main"><div id="content"></div><footer class="footer"><span>13180 操作系统 · 原创练习，不代表官方试卷</span><span id="save-status">进度自动保存在此浏览器</span></footer><noscript>请启用JavaScript后使用互动练习。本文件不需要联网或安装依赖。</noscript></main></div></div><script>const CHAPTERS=['操作系统概论','运行环境与运行机制','进程 / 线程模型','进程 / 线程调度','存储管理','文件系统','设备管理','进程同步与死锁'];
// 原创讲解与练习；章节顺序参照指定教材的出版社目录。
const CARDS=[
[0,'操作系统到底管什么？','操作系统是管理计算机硬件、软件资源，并为用户和应用程序提供服务的系统软件。','处理机、存储器、文件、设备；再加用户接口。','把操作系统想成图书馆管理员：安排谁用座位、书放哪、谁能借书。'],
[0,'并发与并行','并发：同一时间间隔内多个活动交替推进。并行：同一时刻多个活动同时执行。','单核也能并发；真正的同时执行需要多个执行单元。','一位厨师交替炒两道菜是并发；两位厨师各炒一道是并行。'],
[0,'批处理、分时与实时','批处理侧重吞吐率；分时通过时间片提供交互；实时要求在规定时间内响应与完成。','实时强调时间约束，不只是平均速度快。','工资批量结算 / 多用户终端 / 飞行控制。'],
[0,'内核结构与系统启动','宏内核将较多服务置于内核；微内核只保留较少核心功能，其他服务可运行于用户态。启动通常经历固件、引导程序、内核初始化、用户环境。','微内核的隔离性、可扩展性较好，但通信可能有额外开销。','结构题从性能、可靠性、维护扩展三个角度比较。'],
[1,'用户态、内核态与特权指令','处理器状态区分执行权限；I/O控制、修改关键控制寄存器等操作需要特权。普通应用通过系统调用请求内核服务。','用户态进入内核态可由系统调用、异常或中断触发。','应用是顾客，系统调用是服务窗口，内核才有后台钥匙。'],
[1,'中断、异常与系统调用','外部中断通常由外设、时钟等异步事件触发；异常通常源于当前指令执行；系统调用是程序主动请求操作系统服务的受控入口。','发生中断不等于一定切换进程；权限切换也不等于进程切换。','先保存现场，再处理中断，最后恢复合适的执行现场。'],
[1,'存储层次与局部性','寄存器、Cache、主存、外存构成存储层次。时间局部性指刚访问的内容很可能再访问；空间局部性指邻近地址很可能被访问。','层次越靠近CPU，通常越快、越贵、容量越小。','循环反复用同一变量：时间局部性；顺序遍历数组：空间局部性。'],
[1,'程序查询、中断与DMA','查询方式由CPU反复检查状态；中断方式由设备就绪时通知CPU；DMA由控制器在内存与设备之间完成成块传送。','DMA仍需要CPU做初始化、处理完成事件；不是CPU完全不参与。','从“CPU全程盯着”到“通知再处理”到“委托搬运”。'],
[2,'程序与进程、PCB','程序是静态指令集合；进程是程序的一次执行活动，是资源分配的基本单位之一。PCB记录标识、状态、现场、调度与资源信息。','PCB是操作系统管理和识别进程的重要数据结构。','同一程序可对应多个进程；进程具有动态性。'],
[2,'进程三态转换','就绪：除CPU外运行条件已具备；运行：占有CPU；阻塞：等待事件。就绪→运行由调度触发；运行→阻塞由等待事件触发；阻塞→就绪由事件完成触发。','阻塞不能在基本三态模型中直接变运行；就绪通常不能直接变阻塞。','醒了先排队，轮到再工作。'],
[2,'进程与线程','进程是资源拥有和保护的单位；线程是CPU调度和执行的基本单位。同进程线程共享地址空间等资源，各自保留程序计数器、寄存器和栈。','线程有自己的栈；共享资源也意味着需要同步。','同一办公室共享文件柜，每个人有自己的工作进度。'],
[2,'用户级线程与内核级线程','用户级线程由用户态库管理；内核级线程由内核感知和调度。多对一模型中，一个阻塞系统调用可能使整个进程阻塞。','模型很重要：不要把多对一的限制说成所有线程实现的限制。','用户级切换开销小；内核级支持更直接的多核并行。'],
[3,'三个时间指标','周转时间T=完成时刻−到达时刻；带权周转时间W=T/服务时间；等待时间=周转时间−CPU服务时间（本练习无I/O）；响应时间=首次运行−到达。','时刻与时长分清；先画甘特图，再计算。','服务时间2，等3后完成：T=5，W=2.5。'],
[3,'FCFS、SJF与SRTF','FCFS按到达顺序；非抢占SJF从就绪队列选择服务时间最短者；SRTF按剩余时间抢占。','SJF只比较已经到达的进程，不能等未来的短进程而无故空转。','FCFS可能有护航效应；SJF可能使长作业饥饿。'],
[3,'时间片轮转RR','就绪进程依次获得一个时间片，未完成则排到队尾。时间片很大时趋近FCFS；很小则响应较快但切换开销增加。','队列按到达与回队规则演化；题目边界时刻的约定要看清。','一次只跑一小段，排队轮流来。'],
[3,'优先级、反馈队列与实时','优先级调度可能引起饥饿，可用老化缓解。多级反馈队列允许进程在不同队列间移动。EDF按最早截止期优先；RM通常将短周期任务赋予较高固定优先级。','硬实时要求严格满足截止期；软实时允许有限违约但性能下降。','低优先级长期拿不到CPU叫饥饿；不必形成死锁。'],
[4,'连续分配与碎片','固定分区可能存在内部碎片；可变分区产生分散空闲区，存在外部碎片。首次适应找首个足够大空闲区；最佳适应找最小够用区；最坏适应找最大区。','内部：分给你却没用完；外部：空闲但不连续。','紧凑可合并外部碎片，需要相应地址重定位支持。'],
[4,'分页地址转换','页号p=⌊逻辑地址A/页大小S⌋；页内偏移d=A mod S；查页表得页框f；物理地址=f×S+d。','分页前后页内偏移不变。若逻辑页数越界或页未驻留，不能直接套公式。','1 KiB=1024 B；本页所有地址题均按字节编址。'],
[4,'虚拟内存与缺页','虚拟内存利用局部性，仅将所需部分装入主存。访问合法但未驻留页面时产生缺页异常，操作系统调入页面，必要时置换，再重新执行。','虚拟内存不等于物理内存无限；还受地址位数、外存与实现限制。','页表项通常含页框号、存在位、访问位、修改位等。'],
[4,'FIFO、LRU、OPT与抖动','FIFO换最早装入页；LRU换过去最久未访问页；OPT换未来最晚再访问页。抖动是频繁缺页换入换出使有效执行时间大幅下降。','FIFO命中不改装入顺序；LRU命中要更新最近访问记录；FIFO可能出现Belady异常。','缺页次数包含最初空页框的装入；有空位先填空位。'],
[5,'逻辑结构与物理结构','逻辑结构面向用户，可分为字节流等无结构文件与记录式等有结构文件；物理结构描述文件在外存的组织方式，如连续、链接、索引分配。','用户看到的组织与磁盘存放方式分开答。','同一个字节流文件可以用不同物理分配方式保存。'],
[5,'连续、链接与索引分配','连续分配便于顺序和随机访问，但扩展困难、可能有外部碎片；链接分配扩展方便但普通链式随机访问较慢；索引分配用索引表定位数据块。','索引块也占空间；FAT把链接信息集中到表中。','比较题从随机访问、增长、碎片、额外空间四点答。'],
[5,'目录、FCB与inode','目录用于按名查找文件。FCB保存文件管理信息；类UNIX系统的inode记录类型、权限、大小、数据块位置等元数据；目录项建立名字到inode的联系。','文件名通常在目录项中，而非inode本体。','路径解析：逐级查目录，定位元数据，再找数据块。'],
[5,'空闲空间、共享与保护','位示图用位标识磁盘块使用状态；也可用空闲链表等管理。文件保护通过权限、访问控制表等限制访问；共享时需考虑一致性和并发访问。','题目须说明位0/位1代表空闲还是已分配，不能想当然。','硬链接通常共享同一inode；符号链接保存目标路径。'],
[6,'设备分类与软件层次','按传输单位可分字符设备和块设备；设备独立性使应用尽量用统一接口和逻辑设备名。设备驱动负责与特定控制器交互。','应用接口、设备独立软件、驱动、中断处理各有职责。','新增设备时主要替换对应驱动，减少应用改动。'],
[6,'缓冲与I/O效率','缓冲协调生产与消费速度、传输粒度差异，支持I/O与计算重叠。双缓冲允许一块传输时另一块处理。','缓冲不是永久保存；Cache侧重复用，缓冲侧重协调传送。','不要把增加缓冲说成必然提升所有负载的性能。'],
[6,'磁盘调度','FCFS按请求顺序；SSTF找离当前最近请求；SCAN向一个方向服务到磁盘端点再反向；LOOK到该方向最远请求就反向。','SCAN≠LOOK；总移动量=各段磁道距离绝对值之和。','本练习SCAN明确给出磁道范围和初始方向，并只统计到最后请求完成。'],
[6,'SPOOLing与虚拟设备','SPOOLing借助磁盘缓冲和后台进程，把对独占设备的访问转化为对共享队列的访问，典型如打印。','共享的是排队使用的逻辑接口；物理打印机仍按顺序打印。','多个用户同时提交打印任务，后台依次输出。'],
[7,'互斥、同步与临界区','互斥限制同一资源同时被访问；同步约束活动先后。临界区是访问共享资源的代码段。常用要求：空闲让进、忙则等待、有限等待、让权等待。','共享变量本身不是临界区；访问共享变量的那段代码才是。','抢一台打印机是互斥；必须先生产后消费是同步。'],
[7,'P/V与生产者消费者','采用可为负的记录型信号量：P先减1，结果<0则阻塞；V先加1，结果≤0则唤醒一个等待者。互斥量mutex=1，empty=N，full=0。','生产：P(empty)→P(mutex)→放入→V(mutex)→V(full)。消费与之对称。','先申请空位/产品，再进入临界区；不要持有mutex等待空位。'],
[7,'死锁四条件与应对','互斥、占有并等待、不可剥夺、循环等待是死锁必要条件。预防通过破坏某个必要条件；避免通过安全性判断；检测与解除允许先发生再处理。','不安全状态不一定已死锁；安全状态一定不死锁。','资源按统一顺序申请可破坏循环等待。'],
[7,'银行家算法','Need=Max−Allocation。Work=Available；找未完成且Need≤Work的进程，假定完成并令Work+=Allocation。能完成全部则存在安全序列。','比较向量须每一维都≤；释放的是Allocation，不是Max或Need。','新请求先检查Request≤Need且Request≤Available，再试分配并检验安全性。']
].map((c,i)=>({id:i,ch:c[0],title:c[1],body:c[2],trap:c[3],tip:c[4]}));

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
function scheduling(jobs,algo='FCFS',quantum=2){
 const list=jobs.map((p,i)=>({...p,i,left:p.burst,first:null,finish:null})),segments=[];let t=0,done=0,queue=[];
 const segment=(p,len)=>{if(p.first===null)p.first=t;segments.push({name:p.name,start:t,end:t+len});p.left-=len;t+=len;if(!p.left){p.finish=t;done++;}};
 if(algo==='RR'){
  const pending=[...list].sort((a,b)=>a.arrival-b.arrival||a.i-b.i);
  while(done<list.length){if(!queue.length&&pending.length&&t<pending[0].arrival){segments.push({name:'空闲',start:t,end:pending[0].arrival});t=pending[0].arrival;}
   while(pending.length&&pending[0].arrival<=t)queue.push(pending.shift());
   const p=queue.shift();if(!p)throw Error('invalid RR input');segment(p,Math.min(quantum,p.left));
   while(pending.length&&pending[0].arrival<=t)queue.push(pending.shift());if(p.left)queue.push(p);
  }
 }else{
  while(done<list.length){const ready=list.filter(p=>p.left>0&&p.arrival<=t);if(!ready.length){const nt=Math.min(...list.filter(p=>p.left>0).map(p=>p.arrival));segments.push({name:'空闲',start:t,end:nt});t=nt;continue;}
   ready.sort((a,b)=>((algo==='SJF'?a.burst-b.burst:algo==='SRTF'?a.left-b.left:0)||a.arrival-b.arrival||a.i-b.i));const p=ready[0];segment(p,algo==='SRTF'?1:p.left);
  }
 }
 const rows=list.map(p=>({...p,turn:p.finish-p.arrival,weight:(p.finish-p.arrival)/p.burst,wait:p.finish-p.arrival-p.burst,response:p.first-p.arrival}));
 const merged=[];for(const s of segments){const last=merged.at(-1);if(last&&last.name===s.name&&last.end===s.start)last.end=s.end;else merged.push({...s});}
 return{rows,segments:merged,average:rows.reduce((n,p)=>n+p.turn,0)/rows.length,weighted:rows.reduce((n,p)=>n+p.weight,0)/rows.length};
}
function paging(refs,capacity,algo){let frames=[],queue=[],last=new Map(),faults=0;const steps=[];
 refs.forEach((p,i)=>{let fault=!frames.includes(p),out=null;if(fault){faults++;if(frames.length<capacity){frames.push(p);queue.push(p);}else{let victim;
 if(algo==='FIFO')victim=queue.shift();else if(algo==='LRU')victim=[...frames].sort((a,b)=>last.get(a)-last.get(b))[0];else victim=[...frames].sort((a,b)=>{let x=refs.indexOf(a,i+1),y=refs.indexOf(b,i+1);return(y<0?Infinity:y)-(x<0?Infinity:x);})[0];
 out=victim;frames[frames.indexOf(victim)]=p;if(algo==='FIFO')queue.push(p);}}
 last.set(p,i);steps.push({p,frames:[...frames],fault,out});});return{faults,steps};
}
function banker(available,allocation,max){const need=max.map((r,i)=>r.map((v,j)=>v-allocation[i][j])),work=[...available],finished=new Set(),steps=[],sequence=[];
 while(finished.size<allocation.length){const i=need.findIndex((r,i)=>!finished.has(i)&&r.every((v,j)=>v<=work[j]));if(i<0)break;const before=[...work];allocation[i].forEach((v,j)=>work[j]+=v);finished.add(i);sequence.push(i);steps.push({i,before,after:[...work]});}
 return{safe:finished.size===allocation.length,need,steps,sequence,work,unfinished:allocation.map((_,i)=>i).filter(i=>!finished.has(i))};
}
function disk(head,requests,algo,direction='up',maxTrack=199){let order=[];if(algo==='FCFS')order=[...requests];else if(algo==='SSTF'){let p=head,left=[...requests];while(left.length){left.sort((a,b)=>Math.abs(a-p)-Math.abs(b-p)||a-b);p=left.shift();order.push(p);}}else{
 const high=requests.filter(p=>p>=head).sort((a,b)=>a-b),low=requests.filter(p=>p<head).sort((a,b)=>b-a);
 if(direction==='up'){order=[...high];if(low.length){if(algo==='SCAN'&&order.at(-1)!==maxTrack&&head!==maxTrack)order.push(maxTrack);order.push(...low);}}
 else{order=[...low];if(high.length){if(algo==='SCAN'&&order.at(-1)!==0&&head!==0)order.push(0);order.push(...high);}}
 }let prev=head,total=0;const steps=order.map(p=>{const distance=Math.abs(p-prev),from=prev;total+=distance;prev=p;return{from,to:p,distance,total};});return{order,total,steps};
}
function makeLab(kind,choice){
 if(kind==='schedule'){const algo=choice||shuffle(['FCFS','SJF','SRTF','RR'])[0],jobs=['A','B','C','D'].map((name,i)=>({name,arrival:i?rand(0,5):0,burst:rand(1,7)}));return{kind,algo,jobs,quantum:2};}
 if(kind==='address'){const size=2**rand(9,12),page=rand(1,7),offset=rand(0,size-1),frame=rand(8,24);return{kind,size,page,offset,frame,address:page*size+offset};}
 if(kind==='paging')return{kind,algo:choice||shuffle(['FIFO','LRU','OPT'])[0],refs:Array.from({length:12},()=>rand(0,5)),capacity:3};
 if(kind==='banker'){const allocation=Array.from({length:3},()=>[rand(0,3),rand(0,3)]),max=allocation.map(r=>r.map(v=>v+rand(0,4)));return{kind,available:[rand(0,3),rand(0,3)],allocation,max};}
 return{kind:'disk',algo:choice||shuffle(['FCFS','SSTF','SCAN','LOOK'])[0],head:rand(35,165),requests:shuffle(Array.from({length:20},(_,i)=>i*10+rand(0,9))).slice(0,6),direction:rand(0,1)?'up':'down',maxTrack:199};
}
function solveLab(l){if(l.kind==='schedule')return scheduling(l.jobs,l.algo,l.quantum);if(l.kind==='paging')return paging(l.refs,l.capacity,l.algo);if(l.kind==='banker')return banker(l.available,l.allocation,l.max);if(l.kind==='disk')return disk(l.head,l.requests,l.algo,l.direction,l.maxTrack);return{page:Math.floor(l.address/l.size),offset:l.address%l.size,physical:l.frame*l.size+l.offset};}
function labAnswer(l){const s=solveLab(l);return l.kind==='schedule'?s.average:l.kind==='address'?s.physical:l.kind==='paging'?s.faults:l.kind==='banker'?(s.safe?'安全':'不安全'):s.total;}
function labCorrect(l,value){if(l.kind==='banker')return value===labAnswer(l);return String(value).trim()!==''&&Number.isFinite(Number(value))&&Math.abs(Number(value)-labAnswer(l))<0.011;}
if(typeof module!=='undefined')module.exports={scheduling,paging,banker,disk,makeLab,solveLab,labAnswer,labCorrect};

function stats(){const vals=Object.values(state.attempts),total=vals.reduce((n,a)=>n+a.n,0),right=vals.reduce((n,a)=>n+a.right,0);return{unique:vals.length,total,right,accuracy:total?Math.round(right/total*100):0};}
function chapterOptions(value,all='全部章节'){return `<option value="all" ${value==='all'?'selected':''}>${all}</option>`+CHAPTERS.map((c,i)=>`<option value="${i}" ${String(i)===String(value)?'selected':''}>第${i+1}章 · ${c}</option>`).join('');}
function render(){
 $('#nav').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-route="${k}" class="${route===k?'active':''}" ${route===k?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icons[k]}</span>${v}${k==='wrong'&&state.wrong.length?`<span class="count">${state.wrong.length}</span>`:''}</button>`).join('');
 $('#crumb').textContent=labels[route];
 $('#content').innerHTML=({home:homeView,notes:notesView,quiz:quizView,lab:labView,short:shortView,wrong:wrongView,mock:mockView,settings:settingsView})[route]();
 updateSaveStatus();updateClocks();
}
function homeView(){const s=stats(),completed=state.tasks.length;return header('两天，把知识变成分数。','先建立框架，再练到能独立写出来。今天从一次摸底开始。','湖北自考本科 · 两天冲刺')+`
 <section class="hero"><div><div class="eyebrow">YOUR 48-HOUR STUDY SPRINT</div><h2>时间有限，先把能拿的分拿稳。</h2><p>概念用卡片记，算法用步骤练，简答用关键词默写。每轮练习都留下进度，下一轮从薄弱处开始。</p><button data-action="diagnostic">开始 15 题摸底 <span aria-hidden="true">↗</span></button><small>约 10 分钟 · 八章抽题 · 即时解析</small></div><div class="hero-map" aria-hidden="true"><div class="orbit"><div><div class="big">48<span style="font-size:20px">h</span></div><div class="tiny">专注当下的每一轮</div></div><span class="orbit-tag one">理解概念</span><span class="orbit-tag two">动手计算</span><span class="orbit-tag three">闭卷回忆</span></div></div></section>
 <section class="stats"><div class="stat"><div class="stat-label">已练选择题</div><div class="stat-value">${s.unique}<span>/ ${QUESTIONS.length} 题</span></div><div class="stat-foot">覆盖八章核心概念</div></div><div class="stat"><div class="stat-label">累计答题正确率</div><div class="stat-value">${s.total?s.accuracy:'—'}<span>${s.total?'%':'待摸底'}</span></div><div class="stat-foot">${s.total} 次作答，${s.right} 次正确</div></div><div class="stat"><div class="stat-label">待巩固错题</div><div class="stat-value">${state.wrong.length}<span>题</span></div><div class="stat-foot">连续两次答对后移出</div></div><div class="stat"><div class="stat-label">已掌握速记卡</div><div class="stat-value">${state.mastered.length}<span>/ 32 张</span></div><div class="stat-foot">计算训练已完成 ${state.labCount} 次</div></div></section>
 <div class="two-col"><section class="panel"><div class="panel-head"><h2>你的两天路线</h2><span class="tiny muted">${completed} / 10 完成</span></div><div class="tabs"><button data-action="day" data-value="0" class="${day===0?'active':''}">DAY 01 · 建立骨架</button><button data-action="day" data-value="1" class="${day===1?'active':''}">DAY 02 · 形成输出</button></div><div class="progress"><span style="width:${completed*10}%"></span></div><p class="tiny muted">时间为可平移的参考时段；每学习约50分钟休息10分钟。</p>${PLAN.slice(day*5,day*5+5).map((t,j)=>{const i=day*5+j;return `<div class="task"><input type="checkbox" data-task="${i}" aria-label="完成${t[2]}" ${state.tasks.includes(i)?'checked':''}><div class="task-body"><div class="task-time mono">${t[1]}</div><div class="task-title ${state.tasks.includes(i)?'done':''}">${t[2]}</div><p>${t[3]}</p></div><button class="task-go" data-route="${t[4]}" aria-label="前往${t[2]}">↗</button></div>`;}).join('')}</section>
 <aside><section class="panel"><div class="panel-head"><h2>先抓这三件事</h2><span class="badge orange">复习建议</span></div>${[['01','概念对比要能说清','并发 / 并行、就绪 / 阻塞、进程 / 线程、同步 / 互斥。'],['02','计算步骤写在纸上','先列规则与已知条件，再画过程，最后算结果。'],['03','简答按关键词给出层次','定义一句 + 要点分条 + 必要解释。看懂后合上答案复述。']].map(x=>`<div class="focus-card"><div class="focus-number">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</section><div class="notice spaced">优先级是依据知识依赖与两天学习效率制定的建议；不代表已核实的考频或分值。题目均为原创练习。</div><button style="width:100%" data-route="lab">直接进入计算训练 →</button></aside></div>`;}
function notesView(){return header('考点速记','每章四张。读懂后切到「闭卷回忆」，先自己说，再翻答案。','32 张原创速记卡')+`<div class="toolbar"><select id="chapter" aria-label="筛选章节">${chapterOptions(chapter)}</select><input id="note-search" placeholder="搜索：缺页、线程、死锁…" aria-label="搜索考点" value="${e(search)}"><div class="tabs"><button data-action="note-mode" data-value="read" class="${noteMode==='read'?'active':''}">阅读</button><button data-action="note-mode" data-value="recall" class="${noteMode==='recall'?'active':''}">闭卷回忆</button></div><button data-action="print" class="small">打印当前考点</button></div><div class="notes-grid">${CARDS.filter(c=>chapter==='all'||c.ch===Number(chapter)).map(c=>`<article class="note-card" data-search="${e(c.title+c.body+c.trap+c.tip)}" ${search&&!(c.title+c.body+c.trap+c.tip).includes(search)?'hidden':''}><span class="badge">${String(c.ch+1).padStart(2,'0')} · ${CHAPTERS[c.ch]}</span><h3>${c.title}</h3><div class="note-answer ${noteMode==='recall'?'hidden':''}" id="card-${c.id}"><p>${c.body}</p><div class="note-trap">易错提醒 · ${c.trap}</div><div class="note-tip">记忆线索 · ${c.tip}</div></div>${noteMode==='recall'?`<button data-action="reveal-card" data-id="${c.id}">我已尝试回忆，查看答案</button>`:''}<div class="note-actions"><span class="tiny">${c.id+1} / 32</span><button class="small ${state.mastered.includes(c.id)?'active':''}" data-action="master" data-id="${c.id}">${state.mastered.includes(c.id)?'✓ 已记住':'标记已记住'}</button></div></article>`).join('')}</div><div id="notes-empty" class="empty hidden">没有匹配考点，换个关键词试试。</div>`;}
function prepareQuestion(q){const order=shuffle(q.options.map((_,i)=>i));return{...q,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer)};}
function startQuiz(mode='all'){
 let pool=QUESTIONS.filter(q=>quizChapter==='all'||q.ch===Number(quizChapter));
 if(mode==='diagnostic')pool=shuffle(CHAPTERS.flatMap((_,ch)=>shuffle(QUESTIONS.filter(q=>q.ch===ch)).slice(0,2))).slice(0,15);
 else if(mode==='wrong')pool=shuffle(QUESTIONS.filter(q=>state.wrong.includes(q.id)));
 else if(mode==='random')pool=shuffle(pool);
 if(!pool.length){toast('当前没有待复练题目');return;}
 state.quiz={mode,items:pool.map(prepareQuestion),index:0,answers:{},done:false};persist();go(mode==='wrong'?'wrong':'quiz');
}
function record(qid,correct){let a=state.attempts[qid]||{n:0,right:0,streak:0};a.n++;a.right+=correct?1:0;a.streak=correct?a.streak+1:0;state.attempts[qid]=a;if(!correct&&!state.wrong.includes(qid))state.wrong.push(qid);if(correct&&a.streak>=2)state.wrong=state.wrong.filter(id=>id!==qid);}
function quizView(){const run=state.quiz;if(!run||run.mode==='wrong')return header('选择练习','每题答完立即看解析。不要只记选项字母，试着说出理由。','64 题 · 原创单选')+`<div class="panel quiz-wrap"><h2>开始一轮练习</h2><p class="muted smalltext spaced">建议先做15题摸底，再按薄弱章节练。随机练习会打乱题目和选项。</p><div class="toolbar spaced"><select id="quiz-chapter" aria-label="练习章节">${chapterOptions(quizChapter)}</select></div><div class="tag-row"><button class="primary" data-action="start-quiz" data-value="all">按章顺序练习</button><button data-action="start-quiz" data-value="random">随机练习</button><button data-action="diagnostic">15题摸底</button></div></div>`;return activeQuizView(run);}
function activeQuizView(run){const total=run.items.length,n=Object.keys(run.answers).length,right=Object.values(run.answers).filter(a=>a.correct).length;
 if(run.done)return header('这一轮完成了','看懂解析后，合上答案再试一次。')+`<div class="panel quiz-wrap center"><span class="badge">${run.mode==='diagnostic'?'摸底结果':'练习结果'}</span><div class="score-circle"><b>${Math.round(right/total*100)}<small style="font-size:15px">%</small></b><span class="tiny muted">本轮正确率</span></div><p>${total}题 · 答对 ${right} 题 · 答错 ${total-right} 题</p><p class="muted smalltext">这次正确率仅反映本组原创题的表现，不是考试成绩预测。</p><div class="spaced tag-row" style="justify-content:center"><button class="primary" data-action="start-quiz" data-value="wrong">复练错题</button><button data-action="close-quiz">选择新一轮</button><button data-route="notes">回看考点</button></div></div><div class="weak-list spaced">${CHAPTERS.map((c,ch)=>{const list=run.items.filter(q=>q.ch===ch);if(!list.length)return '';const r=list.filter(q=>run.answers[q.id]?.correct).length;return `<div class="weak-item"><b>${ch+1}. ${c}</b><p>${list.length}题中答对 ${r} 题</p><div class="progress"><span style="width:${r/list.length*100}%"></span></div><button class="small" data-action="learn-chapter" data-id="${ch}">回看这一章</button></div>`;}).join('')}</div>`;
 const q=run.items[run.index],a=run.answers[q.id];return header(run.mode==='diagnostic'?'15题摸底':run.mode==='wrong'?'错题复练':'选择练习','先判断，再看解析。答错的题会自动进入错题本。')+`<div class="quiz-wrap"><div class="quiz-meta"><span>第 ${run.index+1} / ${total} 题 · 第${q.ch+1}章 ${CHAPTERS[q.ch]}</span><button class="ghost tiny" data-action="close-quiz">结束本轮</button></div><div class="progress"><span style="width:${n/total*100}%"></span></div><section class="panel"><span class="badge">原创单选 · 单击选项提交</span><h2 class="question-text">${q.q}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${a?(i===q.answer?'correct':i===a.value?'incorrect':''):''}" data-action="answer" data-value="${i}" ${a?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${e(o)}</span></button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'':'bad'}" role="status"><b>${a.correct?'✓ 回答正确':'再巩固一下'} · 正确答案 ${'ABCD'[q.answer]}</b><p>${q.explain}</p></div>`:''}<div class="quiz-bottom"><span class="tiny muted">快捷键 A–D / 1–4 选答案<br>Enter 下一题</span><button class="primary" data-action="next-question" ${a?'':'disabled'}>${run.index===total-1?'查看本轮结果':'下一题 →'}</button></div></section></div>`;
}
function wrongView(){if(state.quiz?.mode==='wrong')return activeQuizView(state.quiz);const list=QUESTIONS.filter(q=>state.wrong.includes(q.id));return header('错题复练','答错自动收录；同题连续两次答对后移出。把理由说清，才算会了。',`${list.length} 题待巩固`)+(list.length?`<div class="toolbar"><button class="primary" data-action="start-quiz" data-value="wrong">开始复练 ${list.length} 题</button></div><div class="weak-list">${list.map(q=>`<div class="weak-item"><span class="badge">第${q.ch+1}章</span><h3 style="font-size:15px;margin:10px 0">${q.q}</h3><p>累计 ${state.attempts[q.id].n} 次作答 · 连续答对 ${state.attempts[q.id].streak} / 2</p><button class="small spaced" data-action="learn-chapter" data-id="${q.ch}">复习相关章节</button></div>`).join('')}</div>`:`<div class="empty"><h3>暂时没有待巩固错题</h3><p class="muted smalltext">做一轮摸底，找到值得投入时间的地方。</p><button class="primary spaced" data-action="diagnostic">开始摸底</button></div>`);}
function shortView(){return header('简答默写','先在输入框闭卷作答，再展开要点自评。这里的勾选代表你的自评。','16 道 · 按点组织答案')+`<div class="toolbar"><select id="short-chapter" aria-label="简答章节">${chapterOptions(shortChapter)}</select><button data-action="print" class="small">打印当前简答</button></div>`+SHORTS.filter(s=>shortChapter==='all'||s.ch===Number(shortChapter)).map(s=>`<section class="panel short-card"><span class="badge">第${s.ch+1}章 · 第${Number(s.id.slice(1))+1}题</span><h3>${s.q}</h3><textarea class="answer-input" data-short="${s.id}" placeholder="先写定义，再分条列关键词。写完后再展开参考要点。" aria-label="${s.q}">${e(state.shortDraft[s.id]||'')}</textarea><div class="spaced"><button class="small" data-action="toggle-short" data-id="${s.id}">${state.shortOpen.includes(s.id)?'收起参考要点':'已尝试作答，展开参考要点'}</button></div>${state.shortOpen.includes(s.id)?`<div class="rubric"><p class="tiny muted">对照自己的答案勾选覆盖点；合理同义表述也可。以下不代表官方评分细则。</p>${s.points.map((p,i)=>`<label><input type="checkbox" data-rubric="${s.id}" data-index="${i}" ${(state.shortChecks[s.id]||[]).includes(i)?'checked':''}><span>${p}</span></label>`).join('')}<div class="tip">答题提醒 · ${s.tip}</div></div>`:''}</section>`).join('');}
const labNames={schedule:'进程调度',address:'分页地址',paging:'页面置换',banker:'银行家算法',disk:'磁盘调度'};
function table(head,rows){return `<div class="table-scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function promptLab(l){if(l.kind==='schedule')return `<p class="lab-prompt">采用 <b>${l.algo}</b>${l.algo==='RR'?`，时间片 ${l.quantum}`:''}。忽略切换开销、无I/O，同到达时刻按A→D排序。${l.algo==='RR'?'时间片边界新到达者先入队，刚运行者后回队。':''}求<b>平均周转时间</b>（保留两位小数）。</p>${table(['进程','到达时刻','服务时间'],l.jobs.map(p=>[p.name,p.arrival,p.burst]))}`;
 if(l.kind==='address')return `<p class="lab-prompt">按字节编址，页大小 <b>${l.size} B</b>，逻辑地址 <b>${l.address}</b>。页号从0开始。页表给出逻辑页 <b>${l.page}</b> 驻留于页框 <b>${l.frame}</b>。地址合法、页面已在主存。求<b>物理地址</b>（十进制）。</p>`;
 if(l.kind==='paging')return `<p class="lab-prompt">采用 <b>${l.algo}</b>，有 <b>${l.capacity}</b> 个初始为空的页框。页面引用串如下。求<b>缺页次数</b>，包括初次装入。</p><div class="formula">${l.refs.join(' → ')}</div>`;
 if(l.kind==='banker')return `<p class="lab-prompt">系统有资源A、B，当前 Available = <b>(${l.available.join(', ')})</b>。下表每个向量依次为A、B数量。判断<b>当前状态是否安全</b>，并在纸上写出安全序列或说明不能继续的原因。</p>${table(['进程','Allocation','Max'],l.allocation.map((r,i)=>['P'+i,`(${r.join(', ')})`,`(${l.max[i].join(', ')})`]))}`;
 return `<p class="lab-prompt">采用 <b>${l.algo}</b>，磁道范围 <b>0–${l.maxTrack}</b>，磁头初始位于 <b>${l.head}</b>，初始方向<b>${l.direction==='up'?'增大':'减小'}</b>。所有请求均已到达。求最后一个请求完成前的<b>总移动磁道数</b>。SSTF等距时选较小磁道；SCAN反向前到达端点，LOOK在最远请求处反向；请求已全部完成即停止。</p><div class="formula">请求顺序：${l.requests.join('，')}</div>`;
}
function solutionLab(l){const s=solveLab(l);
 if(l.kind==='schedule')return `<h3>先画甘特图，再计算</h3><div class="gantt">${s.segments.map(p=>`<div class="gantt-block" style="flex-grow:${p.end-p.start}" data-end="${p.end}">${p.name}<small>${p.start}</small></div>`).join('')}</div>${table(['进程','完成','周转T','带权T/服务','等待','响应'],s.rows.map(p=>[p.name,p.finish,p.turn,p.weight.toFixed(2),p.wait,p.response]))}<div class="formula">平均周转 = (${s.rows.map(p=>p.turn).join(' + ')}) / ${s.rows.length} = ${s.average.toFixed(2)}<br>平均带权周转 = ${s.weighted.toFixed(2)}</div><p class="smalltext">完成时刻从甘特图读出；周转=完成−到达。${l.algo==='SJF'?'只比较当前已到达、尚未完成的进程。':l.algo==='SRTF'?'每到达一个更短的任务都需重新判断是否抢占。':l.algo==='RR'?'只在完成或用完时间片时换队列，按题目约定处理边界到达。':'按到达时刻排队，CPU空闲时等到下一个进程到达。'}</p>`;
 if(l.kind==='address')return `<h3>三步：拆地址 → 查页表 → 拼地址</h3><div class="formula">页号 p = ⌊${l.address} / ${l.size}⌋ = ${s.page}<br>偏移 d = ${l.address} mod ${l.size} = ${s.offset}<br>查页表：页 ${s.page} → 页框 ${l.frame}<br>物理地址 = ${l.frame} × ${l.size} + ${s.offset} = ${s.physical}</div><p class="smalltext">偏移保持不变；不要把页号直接当页框号。</p>`;
 if(l.kind==='paging')return `<h3>逐次访问的页框变化</h3><p class="tiny muted">浅橙色为缺页；“换出”一行指出淘汰页。格子从上到下对应固定页框位置。</p><div class="step-grid">${s.steps.map(x=>`<div class="page-step ${x.fault?'fault':''}"><b>${x.p}</b>${Array.from({length:l.capacity},(_,i)=>`<div class="frame">${x.frames[i]??'—'}</div>`).join('')}<small>${x.fault?'缺页':'命中'}<br>换出${x.out??'—'}</small></div>`).join('')}</div><div class="formula">缺页 ${s.faults} 次 / 访问 ${l.refs.length} 次<br>缺页率 = ${(s.faults/l.refs.length*100).toFixed(2)}%</div><p class="smalltext">${l.algo==='FIFO'?'命中不更新装入次序，淘汰最早装入的页面。':l.algo==='LRU'?'每次访问，包括命中，都更新最近访问时间。': '向后看未来引用；若某页不再出现，优先淘汰它。多个页面未来都不出现时可以任选。'}</p>`;

 const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){go(b.dataset.route);return;}const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
 if(a==='day'){day=Number(v);render();}
 if(a==='diagnostic'||a==='start-quiz'){if(state.quiz&&!state.quiz.done&&a==='diagnostic'&&!confirm('开始摸底会替换尚未结束的本轮练习。已作答记录保留。继续？'))return;startQuiz(a==='diagnostic'?'diagnostic':v);}
 if(a==='answer'){const run=state.quiz,q=run?.items[run.index];if(!q||run.answers[q.id])return;const value=Number(v),correct=value===q.answer;run.answers[q.id]={value,correct};record(q.id,correct);persist();render();}
 if(a==='next-question'){if(!state.quiz.answers[state.quiz.items[state.quiz.index].id])return;if(state.quiz.index===state.quiz.items.length-1)state.quiz.done=true;else state.quiz.index++;persist();render();}
 if(a==='close-quiz'){state.quiz=null;persist();go('quiz');}
 if(a==='learn-chapter'){chapter=Number(id);search='';go('notes');}
 if(a==='note-mode'){noteMode=v;render();}
 if(a==='reveal-card'){$('#card-'+id).classList.remove('hidden');b.remove();}
 if(a==='master'){const n=Number(id);state.mastered=state.mastered.includes(n)?state.mastered.filter(x=>x!==n):[...state.mastered,n];persist();b.classList.toggle('active',state.mastered.includes(n));b.textContent=state.mastered.includes(n)?'✓ 已记住':'标记已记住';}
 if(a==='toggle-short'){state.shortOpen=state.shortOpen.includes(id)?state.shortOpen.filter(x=>x!==id):[...state.shortOpen,id];persist();const y=window.scrollY;render();window.scrollTo(0,y);}
 if(a==='lab-kind'||a==='new-lab'){lab=makeLab(a==='lab-kind'?v:lab.kind,a==='new-lab'?lab.algo:undefined);labResult=null;render();}
 if(a==='check-lab'||a==='reveal-lab'){const value=$('#lab-value').value;if(a==='check-lab'&&!String(value).trim()){toast('先填写结果，再提交');return;}const skipped=a==='reveal-lab',correct=!skipped&&labCorrect(lab,value);labResult={value,correct,skipped};if(!skipped){state.labCount++;if(correct)state.labRight++;persist();}render();}
 if(a==='new-mock'){if(state.mock&&!confirm('重新抽卷将替换已有模拟卷；学习记录保留。继续？'))return;newMock();}
 if(a==='submit-mock'){if(confirm('交卷后将显示解析，不能再修改答案。确认交卷？'))submitMock();}
 if(a==='timer-toggle'){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));timerRunning=false;}else{if(timerRemaining<=0)timerRemaining=1500;timerUntil=Date.now()+timerRemaining*1000;timerRunning=true;}updateClocks();}
 if(a==='timer-reset'){timerRunning=false;timerRemaining=1500;updateClocks();}
 if(a==='print')window.print();
 if(a==='export'){download('13180-学习进度-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(state,null,2));toast('进度已导出');}
 if(a==='import')$('#import-file').click();
 if(a==='download-html')download('13180操作系统-两天冲刺.html','text/html;charset=utf-8',HTML_SOURCE);
 if(a==='reset'){if(confirm('确定清空所有学习记录、草稿和模拟卷？建议先导出备份。')){state=fresh();persist();go('home');toast('学习记录已清空');}}
});
document.addEventListener('input',event=>{const el=event.target;
 if(el.id==='note-search'){search=el.value;let count=0;document.querySelectorAll('[data-search]').forEach(c=>{c.hidden=!c.dataset.search.includes(search);if(!c.hidden)count++;});$('#notes-empty').classList.toggle('hidden',count>0);}
 if(el.dataset.short){state.shortDraft[el.dataset.short]=el.value;persist();}
 if(el.dataset.mockShort){state.mock.text[el.dataset.mockShort]=el.value;persist();}
 if(el.id.startsWith('mock-calc-')){state.mock.calcs[Number(el.id.slice(10))]=el.value;persist();}
});
document.addEventListener('change',async event=>{const el=event.target;
 if(el.id==='chapter'){chapter=el.value;render();}if(el.id==='quiz-chapter')quizChapter=el.value;if(el.id==='short-chapter'){shortChapter=el.value;render();}
 if(el.id==='lab-algo'){lab={...lab,algo:el.value};labResult=null;render();}
 if(el.dataset.task!==undefined){const n=Number(el.dataset.task);state.tasks=el.checked?[...new Set([...state.tasks,n])]:state.tasks.filter(x=>x!==n);persist();render();}
 if(el.dataset.rubric){const id=el.dataset.rubric,i=Number(el.dataset.index),list=state.shortChecks[id]||[];state.shortChecks[id]=el.checked?[...new Set([...list,i])]:list.filter(x=>x!==i);persist();}
 if(el.dataset.mockQ){state.mock.mc[el.dataset.mockQ]=Number(el.value);persist();}
 if(el.dataset.self){if(el.value==='')delete state.mock.self[el.dataset.self];else state.mock.self[el.dataset.self]=Number(el.value);persist();const y=window.scrollY;render();window.scrollTo(0,y);}
 if(el.id.startsWith('mock-calc-')){state.mock.calcs[Number(el.id.slice(10))]=el.value;persist();}
 if(el.id==='import-file'&&el.files[0]){try{if(el.files[0].size>5000000)throw Error('size');const imported=validateImport(JSON.parse(await el.files[0].text()));if(confirm('导入会覆盖此浏览器的当前进度。确认导入？')){state=imported;persist();go('home');toast('进度已恢复');}}catch{toast('导入失败：请使用此页面导出的有效JSON备份');}}
});
document.addEventListener('keydown',event=>{if(['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName)||event.ctrlKey||event.altKey||event.metaKey)return;if(!['quiz','wrong'].includes(route)||!state.quiz||state.quiz.done)return;const k=event.key.toLowerCase(),index='abcd'.includes(k)&&k.length===1?'abcd'.indexOf(k):'1234'.includes(k)&&k.length===1?Number(k)-1:-1;if(index>=0){event.preventDefault();document.querySelector(`[data-action="answer"][data-value="${index}"]`)?.click();}if(event.key==='Enter'&&event.target.tagName!=='BUTTON'){event.preventDefault();$('[data-action="next-question"]')?.click();}});
const HTML_SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
window.OS13180={get state(){return state;},get route(){return route;},go,makeLab,solveLab,labCorrect,validateImport};
render();setInterval(updateClocks,1000);
</script></body></html>
